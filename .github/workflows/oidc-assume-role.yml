name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::249899229305:role/github-actions-bff-deployment-role
          aws-region: ap-southeast-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity