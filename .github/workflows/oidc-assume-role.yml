name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::249899229305:role/github-actions-bff-deployment-role
          aws-region: ap-southeast-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: 249899229305.dkr.ecr.ap-southeast-1.amazonaws.com
          IMAGE_TAG: oidc-test
        run: |
          docker build -t $REGISTRY/capstone/bff-client:$IMAGE_TAG .

      - name: Push Docker image
        env:
          REGISTRY: 249899229305.dkr.ecr.ap-southeast-1.amazonaws.com
          IMAGE_TAG: oidc-test
        run: |
          docker push $REGISTRY/capstone/bff-client:$IMAGE_TAG