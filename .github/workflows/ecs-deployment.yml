name: ECS Deployment Workflow

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: capstone/bff-client
  ECS_CLUSTER: capstone-ecs-cluster
  ECS_SERVICE: bff-client
  ECS_TASK_DEFINITION: bff-client-fargate-td
  ECS_CONTAINER_NAME: bff-client
  REGISTRY: 249899229305.dkr.ecr.ap-southeast-1.amazonaws.com

jobs:
  ecs-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::249899229305:role/github-actions-bff-deployment-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Push Docker image
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Get current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query 'taskDefinition' \
            --output json > task-definition.json

      - name: Remove metadata from current task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' \
          task-definition.json > task-definition-clean.json

          mv task-definition-clean.json task-definition.json

      - name: Update container image
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          ECS_CONTAINER_NAME: bff-client
        run: |
          jq \
            --arg IMAGE "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --arg ECS_CONTAINER_NAME "$ECS_CONTAINER_NAME" \
            '(.containerDefinitions[] | select(.name == $ECS_CONTAINER_NAME)).image = $IMAGE' \
            task-definition.json > task-definition-rendered.json

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition-rendered.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true